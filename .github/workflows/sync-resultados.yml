name: Sync resultados Polla

# El cron automático se deshabilitó: SofaScore/Cloudflare bloquea (devuelve
# 0 resultados, sin error) las IPs de datacenter de GitHub Actions con más
# frecuencia que una IP residencial. El sync ahora corre cada 3h desde una
# tarea programada en la PC de Vicente (Task Scheduler, tarea
# "PollaLigaPro_SyncResultados") — este workflow queda solo para disparo
# manual ocasional (workflow_dispatch), sabiendo que puede fallar igual.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r sync/requirements-sync.txt
          playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Generar .env.prod desde secrets
        run: |
          cat <<EOF > .env.prod
          SUPABASE_URL=${{ secrets.POLLA_SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.POLLA_SUPABASE_KEY }}
          GMAIL_USER=${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          EOF

      - name: Sincronizar resultados
        run: xvfb-run -a python sync/sync_polla.py resultados --prod
